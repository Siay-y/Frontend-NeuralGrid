<div class="settings">
  @if (table.isMaster()) {
    <app-collapsible
      title="Mesa · para todos"
      [open]="store.isSectionOpen('settings-table')"
      (toggled)="store.toggleSection('settings-table')"
    >
      <div class="section">
        <label class="switch" [class.is-on]="fog().enabled">
          <input type="checkbox" class="sr-only" [checked]="fog().enabled" (change)="toggleFog()" />
          <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
          <span class="switch__text">
            <span class="switch__title">Névoa de guerra</span>
            <span class="switch__hint">Jogadores só veem perto da luz.</span>
          </span>
        </label>

        <div class="field">
          <div class="field__row">
            <label class="field__label" for="fog-radius">Alcance da luz</label>
            <span class="value">{{ describeReach(fog().radius) }}</span>
          </div>
          <input
            id="fog-radius"
            class="range"
            type="range"
            step="1"
            [min]="limits.min"
            [max]="limits.max"
            [value]="fog().radius"
            (input)="setRadius($event)"
          />
        </div>
      </div>
    </app-collapsible>
  }

  <app-collapsible
    title="Aparência · só você"
    [open]="store.isSectionOpen('settings-appearance')"
    (toggled)="store.toggleSection('settings-appearance')"
  >
    <div class="section">
      <div class="field">
        <div class="field__row">
          <label class="field__label" for="glass-level">Transparência</label>
          <span class="value">{{
            appearance.glassSupported ? glassLabel(appearance.glass()) : 'Indisponível'
          }}</span>
        </div>
        <input
          id="glass-level"
          class="range"
          type="range"
          [min]="glassRange.min"
          [max]="glassRange.max"
          [step]="glassRange.step"
          [value]="appearance.glass()"
          [disabled]="!appearance.glassSupported"
          (input)="setGlass($event)"
        />
      </div>
    </div>
  </app-collapsible>
</div>
