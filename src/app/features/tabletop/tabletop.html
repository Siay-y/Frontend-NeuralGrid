<div
  class="tabletop"
  [class.is-expanded]="store.sidebarExpanded()"
  [class.has-panel]="panel() !== null"
>
  <app-sidebar class="tabletop__sidebar chrome-dark" />

  <main class="tabletop__stage">
    <app-board />

    <app-map-toolbar class="tabletop__toolbar chrome-dark" />

    <app-dice-tray class="tabletop__tray" />

    <app-presence class="tabletop__presence chrome-dark" />

    @if (panel(); as current) {
      <app-table-panel
        class="tabletop__panel chrome-dark"
        [panel]="current"
        animate.enter="panel-enter"
        animate.leave="panel-leave"
      />
    }

    <app-roll-previews class="tabletop__rolls chrome-dark" />

    <div class="tabletop__notices chrome-dark" aria-live="polite">
      @if (store.notice(); as notice) {
        @for (item of [notice]; track item.id) {
          <div
            class="notice"
            role="status"
            animate.enter="notice-enter"
            animate.leave="notice-leave"
          >
            <span>{{ item.message }}</span>
            <button
              type="button"
              class="icon-button notice__close"
              aria-label="Fechar aviso"
              (click)="store.dismissNotice()"
            >
              <svg lucideX [size]="14" />
            </button>
          </div>
        }
      }
    </div>
  </main>
</div>
