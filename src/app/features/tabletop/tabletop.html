<div class="tabletop" [class.is-expanded]="store.sidebarExpanded()">
  <app-sidebar class="tabletop__sidebar" />

  <main class="tabletop__stage">
    <app-board />

    @if (panel(); as current) {
      <app-table-panel
        class="tabletop__panel"
        [panel]="current"
        animate.enter="panel-enter"
        animate.leave="panel-leave"
      />
    }
  </main>
</div>
